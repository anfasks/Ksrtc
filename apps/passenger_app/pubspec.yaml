name: passenger_app
description: Passenger app for live bus tracking
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.6.0
  go_router: ^14.1.4
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0
  google_maps_flutter: ^2.7.0
  google_maps_flutter_web: ^0.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/config/
