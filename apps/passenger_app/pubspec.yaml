name: passenger_app
description: Passenger-facing Flutter client for live bus journey tracking
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  flutter_dotenv: ^5.1.0
  go_router: ^14.2.1
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.7.0
  google_maps_flutter_web: ^0.5.10
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
